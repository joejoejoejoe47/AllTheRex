<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical Grid World Builder</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121216;
            color: #e0e0e0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Control Panel */
        #sidebar {
            width: 300px;
            background-color: #1a1a24;
            border-right: 2px solid #2a2a38;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: 4px 0 15px rgba(0,0,0,0.5);
            z-index: 10;
        }

        h2 {
            font-size: 1.3rem;
            color: #a78bfa;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 0.8rem;
            color: #8e8ea0;
            margin-bottom: 20px;
        }

        .category-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6b7280;
            margin: 15px 0 8px 0;
            border-bottom: 1px solid #2a2a38;
            padding-bottom: 4px;
        }

        .palette {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }

        .tool-btn {
            background-color: #242433;
            border: 2px solid #2a2a38;
            color: #cfcfdf;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .tool-btn:hover {
            background-color: #2e2e42;
            border-color: #7c3aed;
        }

        .tool-btn.active {
            background-color: #7c3aed;
            border-color: #a78bfa;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(124, 58, 237, 0.4);
        }

        .tool-icon {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            display: inline-block;
        }

        /* Action Buttons */
        .actions-panel {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .action-btn {
            background-color: #2d2d3d;
            border: 1px solid #3d3d52;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background-color: #3d3d52;
        }

        .action-btn.danger {
            background-color: #4a1d1d;
            border-color: #662626;
            color: #f87171;
        }

        .action-btn.danger:hover {
            background-color: #662626;
        }

        /* Main Grid Canvas Area */
        #viewport {
            flex-grow: 1;
            background-color: #0d0d12;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: auto;
            padding: 40px;
        }

        #grid-container {
            display: grid;
            grid-template-columns: repeat(20, 32px);
            grid-template-rows: repeat(20, 32px);
            gap: 1px;
            background-color: #22222e;
            padding: 2px;
            border: 2px solid #2a2a38;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .cell {
            width: 32px;
            height: 32px;
            background-color: #16161f;
            cursor: pointer;
            transition: background-color 0.1s, filter 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            user-select: none;
        }

        .cell:hover {
            filter: brightness(1.3);
            outline: 1px solid rgba(167, 139, 250, 0.5);
            z-index: 2;
        }

        /* Tile Styles */
        .tile-grass { background-color: #1b382b; }
        .tile-water { background-color: #1e3a8a; }
        .tile-bridge { background-color: #78350f; }
        .tile-wall { background-color: #374151; border: 2px inset #4b5563; }
        .tile-door { background-color: #92400e; border: 2px outset #b45309; }
        .tile-tree { background-color: #1b382b; } /* Base grass with tree icon */

        /* Status bar */
        #status {
            position: absolute;
            bottom: 15px;
            right: 25px;
            background: rgba(20, 20, 30, 0.85);
            padding: 8px 15px;
            border-radius: 6px;
            border: 1px solid #2a2a38;
            font-size: 0.8rem;
            color: #9ca3af;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <!-- Sidebar Control Panel -->
    <div id="sidebar">
        <h2>WORLD BUILDER</h2>
        <div class="subtitle">Tactical Grid Creator</div>

        <div class="category-title">Nature & Terrain</div>
        <div class="palette">
            <button class="tool-btn active" data-type="grass" data-icon="">
                <span class="tool-icon" style="background: #1b382b;"></span> Grass
            </button>
            <button class="tool-btn" data-type="water" data-icon="🌊">
                <span class="tool-icon" style="background: #1e3a8a;"></span> Water
            </button>
            <button class="tool-btn" data-type="tree" data-icon="🌲">
                <span class="tool-icon" style="background: #065f46;"></span> Trees
            </button>
        </div>

        <div class="category-title">Structures</div>
        <div class="palette">
            <button class="tool-btn" data-type="bridge" data-icon="🌉">
                <span class="tool-icon" style="background: #78350f;"></span> Bridge
            </button>
            <button class="tool-btn" data-type="wall" data-icon="🧱">
                <span class="tool-icon" style="background: #374151;"></span> Wall
            </button>
            <button class="tool-btn" data-type="door" data-icon="🚪">
                <span class="tool-icon" style="background: #92400e;"></span> Door
            </button>
        </div>

        <div class="category-title">Actions</div>
        <div class="palette">
            <button class="tool-btn" data-type="eraser" data-icon="">
                <span class="tool-icon" style="background: #4b5563;"></span> Eraser
            </button>
        </div>

        <div class="actions-panel">
            <button class="action-btn danger" id="clear-btn">Clear Map</button>
        </div>
    </div>

    <!-- Viewport / Grid Canvas -->
    <div id="viewport">
        <div id="grid-container"></div>
        <div id="status">Selected Tool: <strong id="current-tool-name" style="color: #a78bfa;">Grass</strong> (Click & Drag to paint)</div>
    </div>

    <script>
        const GRID_SIZE = 20;
        const gridContainer = document.getElementById('grid-container');
        const toolButtons = document.querySelectorAll('.tool-btn');
        const currentToolName = document.getElementById('current-tool-name');
        const clearBtn = document.getElementById('clear-btn');

        let currentTool = 'grass';
        let currentIcon = '';
        let isMouseDown = false;

        // Tile definitions
        const tileData = {
            grass: { class: 'tile-grass', icon: '' },
            water: { class: 'tile-water', icon: '🌊' },
            tree:  { class: 'tile-tree', icon: '🌲' },
            bridge:{ class: 'tile-bridge', icon: '🌉' },
            wall:  { class: 'tile-wall', icon: '🧱' },
            door:  { class: 'tile-door', icon: '🚪' },
            eraser:{ class: 'tile-grass', icon: '' }
        };

        // Initialize Grid
        function initGrid() {
            gridContainer.innerHTML = '';
            for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell', 'tile-grass');
                cell.dataset.index = i;

                // Event Listeners for drawing interaction
                cell.addEventListener('mousedown', (e) => {
                    isMouseDown = true;
                    applyTool(cell);
                    e.preventDefault();
                });

                cell.addEventListener('mouseenter', () => {
                    if (isMouseDown) {
                        applyTool(cell);
                    }
                });

                gridContainer.appendChild(cell);
            }
        }

        // Apply selected tool to cell
        function applyTool(cell) {
            // Remove all existing tile classes
            cell.className = 'cell';
            
            const config = tileData[currentTool];
            cell.classList.add(config.class);
            cell.textContent = config.icon;
        }

        // Global mouse up to stop painting drag
        window.addEventListener('mouseup', () => {
            isMouseDown = false;
        });

        // Tool Selection
        toolButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                toolButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTool = btn.dataset.type;
                currentIcon = btn.dataset.icon;
                currentToolName.textContent = btn.textContent.trim();
            });
        });

        // Clear Map Button
        clearBtn.addEventListener('click', () => {
            if (confirm('Are you sure you want to clear your world?')) {
                initGrid();
            }
        });

        // Run setup
        initGrid();
    </script>
</body>
</html>
