<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smooth Audio Narrator</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111827;
      color: #f3f4f6;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
      margin: 0;
    }
    .card {
      width: 100%;
      max-width: 600px;
      background: #1f2937;
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
    }
    textarea {
      width: 100%;
      height: 200px;
      background: #111827;
      color: #f3f4f6;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 0.75rem;
      box-sizing: border-box;
      font-size: 1rem;
      margin: 1rem 0;
      resize: vertical;
    }
    button {
      width: 100%;
      padding: 0.85rem;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #4f46e5; }
    audio { width: 100%; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Smooth Text Reader</h2>
    <p style="color: #9ca3af; font-size: 0.9rem;">Uses Google's smoother web voice engine.</p>
    
    <textarea id="story" placeholder="Paste your story text here..."></textarea>
    <button onclick="playStory()">Play Story</button>
    
    <div id="audioContainer"></div>
  </div>

  <script>
    function playStory() {
      const text = document.getElementById('story').value.trim();
      if (!text) return;

      // Break text into short sentences to prevent URL length issues
      const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
      const container = document.getElementById('audioContainer');
      container.innerHTML = '';

      // Create an audio element for Google Translate TTS API
      const encodedText = encodeURIComponent(text.substring(0, 200)); // First chunk
      const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodedText}&tl=en&client=tw-ob`;

      const audio = document.createElement('audio');
      audio.controls = true;
      audio.autoplay = true;
      audio.src = audioUrl;

      container.appendChild(audio);
    }
  </script>
</body>
</html>
