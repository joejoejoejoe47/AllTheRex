name: Test worlddomination

# Runs World Domination unit tests only. It never deploys and never touches
# Morse Chess, goblin, or other site paths.

on:
  pull_request:
    paths:
      - "worlddomination/**"
      - ".github/workflows/test-worlddomination.yml"
      - ".github/workflows/deploy-worlddomination.yml"
  push:
    branches: [main]
    paths:
      - "worlddomination/**"
      - ".github/workflows/test-worlddomination.yml"
      - ".github/workflows/deploy-worlddomination.yml"

permissions:
  contents: read

concurrency:
  group: test-worlddomination-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: PHP extensions for isolated tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-mbstring php-xml

      - name: PHP tests
        run: php worlddomination/tests/run.php

      - name: Capture parity tests
        run: node worlddomination/tests/capture.test.mjs

      - name: View, tutorial loop, and browser/server score parity
        env:
          PHP_BIN: php
        run: node worlddomination/tests/view.test.mjs

      - name: Health diagnosis (reason codes, no secrets)
        env:
          PHP_BIN: php
        run: |
          sudo apt-get install -y -qq php-mysql
          node worlddomination/tests/health.test.mjs

      - name: Real-pointer browser test (mouse clicks, touch taps, guided loop)
        env:
          PHP_BIN: php
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright-core@1.65.0
          export PLAYWRIGHT_CORE="$RUNNER_TEMP/pw/node_modules/playwright-core/index.mjs"
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node worlddomination/tests/browser/pointer.e2e.mjs

      - name: MySQL end-to-end (same engine family as production)
        env:
          PHP_BIN: php
        run: |
          set -euo pipefail
          sudo systemctl start mysql.service
          mysql -uroot -proot -e "CREATE DATABASE wd_ci CHARACTER SET utf8mb4; CREATE USER 'wd'@'%' IDENTIFIED BY 'wd-ci-pass'; GRANT ALL ON wd_ci.* TO 'wd'@'%';"
          WD_DB_DRIVER=mysql WD_DB_HOST=127.0.0.1 WD_DB_PORT=3306 WD_DB_NAME=wd_ci WD_DB_USER=wd WD_DB_PASS=wd-ci-pass \
            php -S 127.0.0.1:8899 -t worlddomination worlddomination/index.php > /tmp/php-mysql.log 2>&1 &
          sleep 1
          curl -sS http://127.0.0.1:8899/api/health | tee /tmp/h.json; echo
          grep -q '"db":true' /tmp/h.json || { cat /tmp/php-mysql.log; exit 1; }
          mysql -uroot -proot -e "SHOW TABLES FROM wd_ci"
          export PLAYWRIGHT_CORE="$RUNNER_TEMP/pw/node_modules/playwright-core/index.mjs"
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          BASE=http://127.0.0.1:8899 node worlddomination/tests/browser/pointer.e2e.mjs || { tail -50 /tmp/php-mysql.log; exit 1; }
          mysql -uroot -proot -e "SELECT display_name, points, matches FROM wd_ci.wd_scores"
