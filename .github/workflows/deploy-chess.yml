name: Deploy chess to Plesk

on:
  push:
    branches: [main]
    paths:
      - "chess/**"
      - ".github/workflows/deploy-chess.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Kokoro fp32 weights (325 MB) are fetched from a pinned Hugging Face revision
# during this workflow, verified by size and SHA-256, then uploaded explicitly.
# They are not stored in git. Existing per-file lftp, app.html-last, smoke, and
# rollback behavior is unchanged. Credentials remain the existing PLESK_FTP_HOST, PLESK_FTP_USER, and PLESK_FTP_PASSWORD secrets.
#
# Never run two uploads over each other.
concurrency:
  group: deploy-chess
  cancel-in-progress: false

jobs:
  ftp:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.PLESK_FTP_HOST }}
      FTP_USER: ${{ secrets.PLESK_FTP_USER }}
      FTP_PASS: ${{ secrets.PLESK_FTP_PASSWORD }}
      SITE: https://alltherex.com/chess
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Test Kokoro fp32 delivery helpers
        run: bash .github/scripts/test_kokoro_fp32_delivery.sh

      # Official fp32 weights are not in git (325 MB > GitHub's 100 MB limit).
      # Always fetch the pinned Hugging Face revision and verify size + SHA-256.
      - name: Fetch official Kokoro fp32
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source .github/scripts/kokoro_fp32_artifact.env
          dest="chess/$KOKORO_FP32_REL"
          bash .github/scripts/fetch_kokoro_fp32.sh "$dest"

      # The old mirror re-sent all 230 MB in place on every deploy (a fresh checkout makes every
      # file look new), leaving the site half-old/half-new for 6-8 minutes. Now only the files
      # that changed since the last successful deploy are sent: assets, models, sounds and API
      # files first (new hashed files sit beside the old ones; nothing is ever deleted), and the
      # page that points at the new bundle (app.html) last.
      - name: Work out what changed since the last good deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list -R "$GITHUB_REPOSITORY" -w deploy-chess.yml -s success -L 1 --json headSha -q '.[0].headSha' || true)
          if [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null; then
            echo "last good deploy: $last"
            echo "$last" > /tmp/last-good.txt
            git diff --name-only --diff-filter=AMRT "$last" HEAD -- chess > /tmp/changed.txt
          else
            echo "no earlier good deploy found: sending everything"
            git ls-files chess > /tmp/changed.txt
          fi
          grep -v -E '(^|/)config\.php$|^chess/app\.html$|(^|/)\.git|(^|/)\._|__MACOSX/' /tmp/changed.txt > /tmp/upload.txt || true
          # shellcheck disable=SC1091
          source .github/scripts/kokoro_fp32_artifact.env
          dest="chess/$KOKORO_FP32_REL"
          if [ ! -f "$dest" ]; then
            echo "missing fetched model $dest" >&2
            exit 1
          fi
          # Always verify the working-copy file that we will (or would) upload.
          got=$(wc -c < "$dest")
          sha=$(sha256sum "$dest" | awk '{print $1}')
          if [ "$got" != "$KOKORO_FP32_BYTES" ] || [ "$sha" != "$KOKORO_FP32_SHA256" ]; then
            echo "working-copy model failed verification: bytes=$got sha=$sha" >&2
            exit 1
          fi
          # Explicitly upload this non-git file on first install or when live size
          # does not already match the pinned artifact (skip re-sending 325 MB otherwise).
          live_ok=0
          live_code=$(curl -fsSI -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
            -o /tmp/kokoro-live.hdr -w '%{http_code}' "${SITE}/${KOKORO_FP32_REL}" || true)
          live_len=$(awk 'BEGIN{IGNORECASE=1} /^content-length:/{print $2}' /tmp/kokoro-live.hdr | tr -d '\r' | tail -1)
          if [ "$live_code" = "200" ] && [ "$live_len" = "$KOKORO_FP32_BYTES" ]; then
            live_ok=1
          fi
          if ! grep -qxF "$dest" /tmp/upload.txt; then
            if [ "$live_ok" != "1" ]; then
              echo "$dest" >> /tmp/upload.txt
              echo "will upload non-git $dest (live http=$live_code length=${live_len:-none})"
            else
              echo "live already has pinned fp32 ($live_len bytes); will not re-upload non-git model"
            fi
          else
            echo "will upload non-git $dest (already in git-changed list)"
          fi
          echo "$(wc -l < /tmp/upload.txt) files to send:"; cat /tmp/upload.txt
          python3 - <<'PY'
          import os, shlex
          files = [l.strip() for l in open("/tmp/upload.txt") if l.strip()]
          for dest in ("chess", "alltherex/chess"):
              lines = ["set ftp:ssl-allow no", "set net:max-retries 4", "set net:reconnect-interval-base 5", "set cmd:fail-exit yes"]
              made = set()
              for f in files:
                  rel = f[len("chess/"):]
                  d = os.path.dirname(rel)
                  remote_dir = dest + ("/" + d if d else "")
                  if d and remote_dir not in made:
                      lines.append("mkdir -p -f " + shlex.quote(remote_dir))
                      made.add(remote_dir)
                  lines.append("put " + shlex.quote(f) + " -o " + shlex.quote(dest + "/" + rel))
              lines.append("put chess/app.html -o " + dest + "/app.html")
              lines.append("bye")
              open("/tmp/lftp-" + dest.replace("/", "_") + ".txt", "w").write("\n".join(lines) + "\n")
          PY

      - name: Upload (changed files only, page last)
        run: |
          for dest in chess alltherex_chess; do
            echo "== $dest"
            # One retry of the whole list (a file locked by IIS fails a put); the page goes last
            # either way, so a failure here leaves the previous page and its assets live.
            lftp -u "$FTP_USER","$FTP_PASS" -e "source /tmp/lftp-$dest.txt" "$FTP_HOST" || \
              { sleep 20; lftp -u "$FTP_USER","$FTP_PASS" -e "source /tmp/lftp-$dest.txt" "$FTP_HOST"; }
          done

      # Fail loudly if the live site is not whole, and put the previous page back.
      - name: Smoke test
        id: smoke
        run: |
          set -u
          bad=0
          sleep 5
          want=$(grep -o 'assets/index-[^"]*\.js' chess/app.html | head -1)
          page=$(curl -fsS -m 30 "$SITE/?smoke=$GITHUB_RUN_ID") || { echo "::error::/chess/ did not load"; bad=1; }
          echo "$page" | grep -q "$want" || { echo "::error::live page does not point at $want"; bad=1; }
          for a in $(grep -o 'assets/[^"]*\.\(js\|css\)' chess/app.html | sort -u); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 60 "$SITE/$a")
            [ "$code" = 200 ] || { echo "::error::$a -> $code"; bad=1; }
          done
          sess=$(curl -s -m 30 -w ' %{http_code}' "$SITE/api/auth/get-session")
          case "$sess" in *" 200") echo "api ok: $sess";; *) echo "::error::api/auth/get-session -> $sess"; bad=1;; esac
          while IFS= read -r f; do
            rel=${f#chess/}
            want_size=$(stat -c %s "$f")
            got=$(curl -sI -m 60 --retry 2 "$SITE/$rel?smoke=$GITHUB_RUN_ID" | tr -d '\r' | awk 'NR==1{c=$2} tolower($1)=="content-length:"{l=$2} END{print c" "l}')
            [ "$got" = "200 $want_size" ] || { echo "::error::$rel -> $got (want 200 $want_size)"; bad=1; }
          done < <(find chess -name '*.glb' | sort)
          # Versioned models should be served with long-lived caching (web.config outbound rule).
          # Only a warning: a missing header is slower, not broken.
          g=$(find chess -name '*.glb' | sort | head -1 || true); g=${g#chess/}
          cc=$(curl -sI -m 60 "$SITE/$g?v=5a0e5a0e" | tr -d '\r' | awk 'tolower($1)=="cache-control:"{$1="";print}' || true)
          echo "cache-control on versioned $g:$cc"
          case "$cc" in *immutable*) ;; *) echo "::warning::versioned $g has no immutable Cache-Control";; esac
          # Same-origin fp32 destination (not hashed). Confirm size when the verified file is present.
          if [ -f "chess/bots/kokoro/models/onnx-community/Kokoro-82M-v1.0-ONNX/onnx/model.onnx" ]; then
            # shellcheck disable=SC1091
            source .github/scripts/kokoro_fp32_artifact.env
            ua="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
            model_ok=0
            for attempt in 1 2 3 4 5 6; do
              got=$(curl -sI -m 120 --retry 2 -A "$ua" "$SITE/$KOKORO_FP32_REL?smoke=$GITHUB_RUN_ID" | tr -d '\r' | awk 'NR==1{c=$2} tolower($1)=="content-length:"{l=$2} END{print c" "l}')
              if [ "$got" = "200 $KOKORO_FP32_BYTES" ]; then
                model_ok=1
                echo "fp32 model dest ok: $SITE/$KOKORO_FP32_REL -> $got"
                break
              fi
              echo "fp32 model dest not ready (attempt $attempt): $got (want 200 $KOKORO_FP32_BYTES)"
              sleep 10
            done
            [ "$model_ok" = 1 ] || { echo "::error::$KOKORO_FP32_REL -> not 200 $KOKORO_FP32_BYTES"; bad=1; }
          fi
          echo "bad=$bad" >> "$GITHUB_OUTPUT"
          [ "$bad" = 0 ]

      - name: Roll back the page to the previous build
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          prev=$(git log -2 --format=%H -- chess/app.html | tail -1)
          git show "$prev:chess/app.html" > /tmp/app-prev.html
          # Server config is not hashed like assets, so a bad web.config would stay live:
          # put back the copies from the last good deploy (or the previous commit) as well.
          good=$(cat /tmp/last-good.txt 2>/dev/null || git rev-parse HEAD~1)
          extra=""
          for c in web.config app/web.config; do
            if git show "$good:chess/$c" > "/tmp/prev-$(echo $c | tr / _)" 2>/dev/null; then
              extra="$extra put /tmp/prev-$(echo $c | tr / _) -o DEST/$c;"
            fi
          done
          for dest in chess alltherex/chess; do
            lftp -u "$FTP_USER","$FTP_PASS" -e "set ftp:ssl-allow no; set net:max-retries 4; ${extra//DEST/$dest} put /tmp/app-prev.html -o $dest/app.html; bye" "$FTP_HOST"
          done
          echo "::error::Smoke test failed; the page was rolled back to $prev and web.config to $good"
