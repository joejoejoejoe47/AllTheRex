name: Deploy worlddomination to Plesk

# Uploads only worlddomination/ files. It never uploads chess/, goblin/, or
# any other site path. Credentials remain the existing PLESK_FTP_HOST,
# PLESK_FTP_USER, and PLESK_FTP_PASSWORD secrets.

on:
  push:
    branches: [main]
    paths:
      - "worlddomination/**"
      - ".github/workflows/deploy-worlddomination.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worlddomination
  cancel-in-progress: false

jobs:
  ftp:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.PLESK_FTP_HOST }}
      FTP_USER: ${{ secrets.PLESK_FTP_USER }}
      FTP_PASS: ${{ secrets.PLESK_FTP_PASSWORD }}
      SITE: https://alltherex.com/worlddomination
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Build an upload list of World Domination files only
        run: |
          set -euo pipefail
          git ls-files worlddomination > /tmp/wd-all.txt
          grep -v -E '(^|/)\.env$|(^|/)install\.php$|(^|/)worlddomination/tests/|(^|/)worlddomination/app/storage/|(^|/)\.git|(^|/)\._' /tmp/wd-all.txt > /tmp/upload.txt || true
          if grep -E '(^|/)install\.php$' /tmp/upload.txt; then
            echo "::error::install.php must not be uploaded"
            exit 1
          fi
          if [ ! -s /tmp/upload.txt ]; then
            echo "::error::no worlddomination files to upload"
            exit 1
          fi
          echo "$(wc -l < /tmp/upload.txt) files to send"
          python3 - <<'PY'
          import os, shlex
          files = [l.strip() for l in open("/tmp/upload.txt") if l.strip()]
          page = "worlddomination/app.html"
          rest = [f for f in files if f != page]
          ordered = rest + ([page] if page in files else [])
          for dest in ("worlddomination", "alltherex/worlddomination"):
              lines = ["set ftp:ssl-allow no", "set net:max-retries 4", "set net:reconnect-interval-base 5", "set cmd:fail-exit yes"]
              # First deploy: the site folder itself may not exist yet.
              lines.append("mkdir -p -f " + shlex.quote(dest))
              made = {dest}
              for f in ordered:
                  rel = f[len("worlddomination/"):]
                  d = os.path.dirname(rel)
                  remote_dir = dest + ("/" + d if d else "")
                  if d and remote_dir not in made:
                      lines.append("mkdir -p -f " + shlex.quote(remote_dir))
                      made.add(remote_dir)
                  lines.append("put " + shlex.quote(f) + " -o " + shlex.quote(dest + "/" + rel))
              lines.append("bye")
              open("/tmp/lftp-" + dest.replace("/", "_") + ".txt", "w").write("\n".join(lines) + "\n")
          PY

      - name: Upload (World Domination only, page last)
        run: |
          for dest in worlddomination alltherex_worlddomination; do
            echo "== $dest"
            lftp -u "$FTP_USER","$FTP_PASS" -e "source /tmp/lftp-$dest.txt" "$FTP_HOST" || \
              { sleep 20; lftp -u "$FTP_USER","$FTP_PASS" -e "source /tmp/lftp-$dest.txt" "$FTP_HOST"; }
          done

      - name: Provision database settings (only when the server has none)
        # World Domination reuses the Morse Chess MySQL database (its own wd_*
        # tables). PHP on the host cannot always read chess/app/.env from
        # here (open_basedir), so copy ONLY its DB_* lines into
        # worlddomination/app/.env. Values are masked, never printed, never
        # committed; temp files are shredded; an existing
        # worlddomination/app/.env is never overwritten; chess/app/.env is
        # only read.
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d)
          cleanup() { find "$work" -type f -exec shred -u {} + 2>/dev/null || true; rm -rf "$work"; }
          trap cleanup EXIT
          ftp() { lftp -u "$FTP_USER","$FTP_PASS" -e "set ftp:ssl-allow no; set net:max-retries 3; set cmd:fail-exit yes; $1; bye" "$FTP_HOST"; }
          echo "FTP root folders: $(ftp 'cls -1' 2>/dev/null | tr -d '\r' | grep '/$' | tr '\n' ' ' || true)"
          found=""
          for src in chess/app/.env alltherex/chess/app/.env; do
            if ftp "get $src -o $work/chess.env" >/dev/null 2>&1 && [ -s "$work/chess.env" ]; then
              found="$src"; break
            fi
          done
          if [ -z "$found" ]; then
            echo "::warning::no readable chess/app/.env over FTP; database settings must be set in Plesk"
            exit 0
          fi
          echo "Morse Chess settings file found at $found (DB_* keys will be copied)"
          tr -d '\r' < "$work/chess.env" \
            | grep -E '^[[:space:]]*(DB_DRIVER|DB_HOST|DB_PORT|DB_NAME|DB_USER|DB_PASS|DB_SOCKET)[[:space:]]*=' > "$work/db.env" || true
          shred -u "$work/chess.env"
          while IFS= read -r line; do
            v="${line#*=}"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"
            v="${v#\"}"; v="${v%\"}"; v="${v#\'}"; v="${v%\'}"
            k="${line%%=*}"; k="${k//[[:space:]]/}"
            case "$k" in DB_DRIVER|DB_PORT) ;; *) if [ -n "$v" ]; then echo "::add-mask::$v"; fi;; esac
          done < "$work/db.env"
          keys=$(cut -d= -f1 "$work/db.env" | tr -d ' ' | sort -u | tr '\n' ' ')
          echo "DB keys present (names only): $keys"
          if ! grep -qE '^[[:space:]]*DB_NAME[[:space:]]*=' "$work/db.env" || ! grep -qE '^[[:space:]]*DB_USER[[:space:]]*=' "$work/db.env"; then
            echo "::warning::chess/app/.env has no DB_NAME/DB_USER (Morse may use Plesk environment variables); nothing copied"
            exit 0
          fi
          { echo "# Copied by the deploy workflow: DB_* keys only from the Morse Chess settings."; cat "$work/db.env"; } > "$work/wd.env"
          for dest in worlddomination alltherex/worlddomination; do
            if ! ftp "cls -1 $dest/app/" >/dev/null 2>&1; then
              echo "$dest/app: not on this server, skipped"; continue
            fi
            if ftp "get $dest/app/.env -o $work/existing.env" >/dev/null 2>&1; then
              [ -f "$work/existing.env" ] && shred -u "$work/existing.env"
              echo "$dest/app/.env already exists: left untouched"
              continue
            fi
            ftp "put $work/wd.env -o $dest/app/.env" >/dev/null
            echo "$dest/app/.env created (DB_* keys only)"
          done

      - name: Smoke test
        run: |
          set -u
          bad=0
          sleep 5
          page=$(curl -fsS -m 30 "$SITE/?smoke=$GITHUB_RUN_ID") || { echo "::error::/worlddomination/ did not load"; bad=1; page=""; }
          echo "$page" | grep -q "World Domination" || { echo "::error::live page is missing the World Domination title"; bad=1; }
          echo "$page" | grep -q "assets/js/main.js" || { echo "::error::live page does not point at the game script"; bad=1; }
          for a in assets/js/main.js assets/js/game.js assets/js/capture.js assets/js/camera.js assets/js/guide.js assets/js/terrain.js assets/css/game.css assets/data/countries.json; do
            code=$(curl -s -o /tmp/wd-asset -w '%{http_code}' -m 60 "$SITE/$a")
            [ "$code" = 200 ] || { echo "::error::$a -> $code"; bad=1; }
          done
          python3 - <<'PY' || { echo "::error::countries.json is not valid Natural Earth data"; exit 1; }
          import json,sys
          data=json.load(open("/tmp/wd-asset"))
          assert data.get("count",0) >= 150
          assert "Natural Earth" in (data.get("attribution") or data.get("source") or "")
          assert isinstance(data.get("countries"), list) and len(data["countries"]) >= 150
          print("countries ok", data["count"])
          PY
          health_code=$(curl -sS -o /tmp/wd-health -w '%{http_code}' -m 30 "$SITE/api/health" || true)
          if [ "$health_code" != 200 ]; then
            echo "::error::api/health HTTP $health_code (refusing to treat an unhealthy database as success)"
            echo "body (reason codes only, no secrets): $(cat /tmp/wd-health 2>/dev/null)"
            bad=1
          else
            python3 - <<'PY' || { echo "::error::api/health was 200 but db was not healthy"; bad=1; }
          import json
          data=json.load(open("/tmp/wd-health"))
          assert data.get("ok") is True, data
          assert data.get("db") is True, data
          print("api health ok", data)
          PY
          fi
          for priv in install.php app/.env app/src/Auth.php app/storage/worlddom.sqlite tests/AuthTest.php; do
            code=$(curl -sS -o /tmp/wd-priv -w '%{http_code}' -m 20 "$SITE/$priv" || true)
            case "$code" in
              403|404) echo "private $priv -> $code";;
              *) echo "::error::$priv was publicly reachable (HTTP $code)"; bad=1;;
            esac
          done
          [ "$bad" = 0 ]
