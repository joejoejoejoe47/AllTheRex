name: One-shot MasterGus coin grant (t403u)

# Temporary owner-requested grant (t403u). Uploads a one-shot PHP file to
# Plesk, runs it, then deletes it. Does not touch deploy-chess or game files.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grant-mastergus-coins-t403u
  cancel-in-progress: false

jobs:
  grant:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.PLESK_FTP_HOST }}
      FTP_USER: ${{ secrets.PLESK_FTP_USER }}
      FTP_PASS: ${{ secrets.PLESK_FTP_PASSWORD }}
      SITE: https://alltherex.com/chess
      GRANT_PHP_B64: 
    steps:
      - name: Upload, run, and delete the one-shot grant
        run: |
          set -euo pipefail
          if [ -z "${FTP_HOST:-}" ] || [ -z "${FTP_USER:-}" ] || [ -z "${FTP_PASS:-}" ]; then
            echo "missing PLESK_FTP secrets" >&2
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          TOKEN=$(openssl rand -hex 24)
          NAME="t403u_${TOKEN}.php"
          TOKEN="$TOKEN" python3 -c "import os,base64; d=base64.b64decode(os.environ['GRANT_PHP_B64']); open('/tmp/grant.php','wb').write(d.replace(b'TOKEN_PLACEHOLDER', os.environ['TOKEN'].encode()))"
          lftp_cmd() {
            lftp -u "$FTP_USER","$FTP_PASS" -e "set ftp:ssl-allow no; set net:max-retries 4; set net:reconnect-interval-base 5; set cmd:fail-exit yes; $1 bye" "$FTP_HOST"
          }
          cleanup() {
            set +e
            for dest in chess alltherex/chess; do
              lftp_cmd "rm -f $dest/$NAME;" >/dev/null 2>&1 || true
            done
          }
          trap cleanup EXIT
          for dest in chess alltherex/chess; do
            echo "uploading to $dest"
            lftp_cmd "put /tmp/grant.php -o $dest/$NAME;"
          done
          echo "running grant"
          set +e
          resp=$(curl -sS -m 60 -w '\nHTTP:%{http_code}' "$SITE/$NAME?k=$TOKEN")
          code=$?
          set -e
          echo "$resp"
          if [ $code -ne 0 ] || ! echo "$resp" | tail -1 | grep -q 'HTTP:200'; then
            echo "grant request failed" >&2
            exit 1
          fi
          if ! echo "$resp" | grep -q '"ok":true'; then
            echo "grant did not report ok" >&2
            exit 1
          fi
          echo "grant ok"
