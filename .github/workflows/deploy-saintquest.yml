name: Deploy saintquest to Plesk

# Uploads only saintquest/ files. It never uploads chess/, goblin/, or
# any other site path. Credentials remain the existing PLESK_FTP_HOST,
# PLESK_FTP_USER, and PLESK_FTP_PASSWORD secrets.

on:
  push:
    branches: [main]
    paths:
      - "saintquest/**"
      - ".github/workflows/deploy-saintquest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-saintquest
  cancel-in-progress: false

jobs:
  ftp:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.PLESK_FTP_HOST }}
      FTP_USER: ${{ secrets.PLESK_FTP_USER }}
      FTP_PASS: ${{ secrets.PLESK_FTP_PASSWORD }}
      SITE: https://alltherex.com/saintquest
    steps:
      - uses: actions/checkout@v4

      - name: Build an upload list of Saint Quest files only
        run: |
          set -euo pipefail
          git ls-files saintquest > /tmp/sq-all.txt
          grep -v -E '(^|/)\.env$|(^|/)install\.php$|(^|/)saintquest/tests/|(^|/)saintquest/app/storage/|(^|/)\.git|(^|/)\._' /tmp/sq-all.txt > /tmp/upload.txt || true
          if grep -E '(^|/)install\.php$' /tmp/upload.txt; then
            echo "::error::install.php must not be uploaded"
            exit 1
          fi
          if [ ! -s /tmp/upload.txt ]; then
            echo "::error::no saintquest files to upload"
            exit 1
          fi
          echo "$(wc -l < /tmp/upload.txt) files to send"
          python3 - <<'PY'
          import os, shlex
          files = [l.strip() for l in open("/tmp/upload.txt") if l.strip()]
          page = "saintquest/app.html"
          rest = [f for f in files if f != page]
          ordered = rest + ([page] if page in files else [])
          for dest in ("saintquest", "alltherex/saintquest"):
              lines = ["set ftp:ssl-allow no", "set net:max-retries 4", "set net:reconnect-interval-base 5", "set cmd:fail-exit yes"]
              # First deploy: the site folder itself may not exist yet.
              lines.append("mkdir -p -f " + shlex.quote(dest))
              made = {dest}
              for f in ordered:
                  rel = f[len("saintquest/"):]
                  d = os.path.dirname(rel)
                  remote_dir = dest + ("/" + d if d else "")
                  if d and remote_dir not in made:
                      lines.append("mkdir -p -f " + shlex.quote(remote_dir))
                      made.add(remote_dir)
                  lines.append("put " + shlex.quote(f) + " -o " + shlex.quote(dest + "/" + rel))
              lines.append("bye")
              open("/tmp/lftp-" + dest.replace("/", "_") + ".txt", "w").write("\n".join(lines) + "\n")
          PY

      - name: Upload (Saint Quest only, page last)
        run: |
          # No apt: use lftp only if the runner already has it, else
          # replay the same plan with Python's standard ftplib.
          if ! command -v lftp >/dev/null; then
            python3 - <<'PY'
          import ftplib, os, shlex, sys, time
          def connect():
              f = ftplib.FTP(os.environ["FTP_HOST"], timeout=60)
              f.login(os.environ["FTP_USER"], os.environ["FTP_PASS"])
              return f
          def mkdirs(f, path):
              cur = ""
              for part in path.split("/"):
                  cur = cur + "/" + part if cur else part
                  try: f.mkd(cur)
                  except ftplib.error_perm: pass
          for dest in ("saintquest", "alltherex_saintquest"):
              print("==", dest, flush=True)
              f = connect(); sent = 0
              for line in open("/tmp/lftp-" + dest + ".txt"):
                  a = shlex.split(line)
                  if not a: continue
                  if a[0] == "mkdir": mkdirs(f, a[-1]); continue
                  if a[0] != "put": continue
                  src, remote = a[1], a[3]
                  for attempt in range(5):
                      try:
                          with open(src, "rb") as fh: f.storbinary("STOR " + remote, fh)
                          sent += 1; break
                      except (ftplib.all_errors) as e:
                          print("retry", remote, e, flush=True); time.sleep(5 * (attempt + 1))
                          try: f.close()
                          except Exception: pass
                          f = connect()
                  else:
                      sys.exit("upload failed: " + remote)
              f.quit(); print(dest, sent, "files sent", flush=True)
          PY
            exit 0
          fi
          for dest in saintquest alltherex_saintquest; do
            echo "== $dest"
            lftp -u "$FTP_USER","$FTP_PASS" -e "source /tmp/lftp-$dest.txt" "$FTP_HOST" || \
              { sleep 20; lftp -u "$FTP_USER","$FTP_PASS" -e "source /tmp/lftp-$dest.txt" "$FTP_HOST"; }
          done

      - name: Provision database settings (only when the server has none)
        # Saint Quest reuses the Morse Chess MySQL database (its own sq_*
        # tables). PHP on the host cannot always read chess/app/.env from
        # here (open_basedir), so copy ONLY its DB_* lines into
        # saintquest/app/.env. Values are masked, never printed, never
        # committed; temp files are shredded; an existing
        # saintquest/app/.env is never overwritten; chess/app/.env is
        # only read.
        # Python ftplib only (no apt/lftp needed). The file is held in
        # memory, never written to the runner's disk.
        run: |
          python3 - <<'PY'
          import ftplib, io, os, re
          f = ftplib.FTP(os.environ["FTP_HOST"], timeout=60)
          f.login(os.environ["FTP_USER"], os.environ["FTP_PASS"])
          def get(path):
              buf = io.BytesIO()
              try:
                  f.retrbinary("RETR " + path, buf.write)
              except ftplib.all_errors:
                  return None
              return buf.getvalue()
          found = text = None
          for src in ("chess/app/.env", "alltherex/chess/app/.env"):
              data = get(src)
              if data:
                  found, text = src, data.decode("utf-8", "replace"); break
          if not found:
              print("::warning::no readable chess/app/.env over FTP; database settings must be set in Plesk")
              raise SystemExit(0)
          print("Morse Chess settings file found at", found, "(DB_* keys will be copied)")
          pat = re.compile(r"^\s*(DB_DRIVER|DB_HOST|DB_PORT|DB_NAME|DB_USER|DB_PASS|DB_SOCKET)\s*=")
          lines = [l for l in text.replace("\r", "").split("\n") if pat.match(l)]
          del text
          keys = set()
          for l in lines:
              k, v = l.split("=", 1)
              k = k.strip(); v = v.strip().strip('"').strip("'")
              keys.add(k)
              if k not in ("DB_DRIVER", "DB_PORT") and v:
                  print("::add-mask::" + v)
          print("DB keys present (names only):", " ".join(sorted(keys)))
          if not {"DB_NAME", "DB_USER"} <= keys:
              print("::warning::chess/app/.env has no DB_NAME/DB_USER; nothing copied")
              raise SystemExit(0)
          body = ("# Copied by the deploy workflow: DB_* keys only from the Morse Chess settings.\n" + "\n".join(lines) + "\n").encode()
          for dest in ("saintquest", "alltherex/saintquest"):
              try:
                  f.nlst(dest + "/app")
              except ftplib.all_errors:
                  print(dest + "/app: not on this server, skipped"); continue
              if get(dest + "/app/.env") is not None:
                  print(dest + "/app/.env already exists: left untouched"); continue
              f.storbinary("STOR " + dest + "/app/.env", io.BytesIO(body))
              print(dest + "/app/.env created (DB_* keys only)")
          f.quit()
          PY

      - name: Smoke test
        run: |
          set -u
          bad=0
          sleep 5
          page=$(curl -fsS -m 30 "$SITE/?smoke=$GITHUB_RUN_ID") || { echo "::error::/saintquest/ did not load"; bad=1; page=""; }
          echo "$page" | grep -q "Saint Quest" || { echo "::error::live page is missing the Saint Quest title"; bad=1; }
          echo "$page" | grep -q "assets/js/main.js" || { echo "::error::live page does not point at the game script"; bad=1; }
          for a in assets/js/main.js assets/js/home.js assets/js/battle.js assets/css/sq.css assets/data/saints.json assets/vendor/three-bundle.min.js assets/vendor/jsQR.min.js assets/models/rogue-hooded.glb assets/models/anim-general.glb assets/img/home-bg.webp; do
            code=$(curl -s -o /tmp/sq-asset -w '%{http_code}' -m 60 "$SITE/$a")
            [ "$code" = 200 ] || { echo "::error::$a -> $code"; bad=1; }
          done
          health_code=$(curl -sS -o /tmp/sq-health -w '%{http_code}' -m 30 "$SITE/api/health" || true)
          if [ "$health_code" != 200 ]; then
            echo "::error::api/health HTTP $health_code (refusing to treat an unhealthy database as success)"
            echo "body (reason codes only, no secrets): $(cat /tmp/sq-health 2>/dev/null)"
            bad=1
          else
            python3 - <<'PY' || { echo "::error::api/health was 200 but db was not healthy"; bad=1; }
          import json
          data=json.load(open("/tmp/sq-health"))
          assert data.get("ok") is True, data
          assert data.get("db") is True, data
          print("api health ok", data)
          PY
          fi
          for priv in install.php app/.env app/src/Auth.php app/sql/schema.mysql.sql app/storage/ tests/AuthTest.php; do
            code=$(curl -sS -o /tmp/sq-priv -w '%{http_code}' -m 20 "$SITE/$priv" || true)
            case "$code" in
              403|404) echo "private $priv -> $code";;
              *) echo "::error::$priv was publicly reachable (HTTP $code)"; bad=1;;
            esac
          done
          [ "$bad" = 0 ]
