name: Publish stadium chunks

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Copy the chunks the live bundle imports
        run: |
          git fetch origin php-chess-site
          git checkout origin/php-chess-site -- \
            chess/assets/fireworks-cPhj2bGA.js \
            chess/assets/park-field-Ol8e5Lha.js
          git config user.name "Code Interactive"
          git config user.email "code@interactive"
          git add chess/assets/fireworks-cPhj2bGA.js chess/assets/park-field-Ol8e5Lha.js
          if git diff --cached --quiet; then
            echo "chunks already on main"
            exit 0
          fi
          git commit -m "Publish the football stadium chunks so the field draws."
          git push origin HEAD:main
