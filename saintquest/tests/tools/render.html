<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body><canvas id="c" width="512" height="512"></canvas>
<script type="module">
window.SQ_BASE = '';
import { createSaint, THREE } from '/assets/js/saint3d.js';
const p = new URLSearchParams(location.search);
const def = JSON.parse(p.get('def'));
const bg = p.get('bg');
const canvas = document.getElementById('c');
const size = +(p.get('size') || 512);
canvas.width = canvas.height = size;
const r = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
r.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
if (bg) scene.background = new THREE.Color(bg);
scene.add(new THREE.HemisphereLight(0xfff6e0, 0x6a8a5a, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(2, 4, 5); scene.add(sun);
const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
const s = await createSaint(def, { animate: p.get('anim') !== '0' });
scene.add(s.object);
const box = new THREE.Box3().setFromObject(s.object);
const h = box.max.y - box.min.y; const cy = (box.max.y + box.min.y) / 2;
const view = p.get('view') || 'full';
if (view === 'head') { cam.position.set(0, box.max.y - h * 0.28, h * 1.25); cam.lookAt(0, box.max.y - h * 0.3, 0); }
else { cam.position.set(0, cy + h * 0.05, h * 2.3); cam.lookAt(0, cy, 0); }
s.update(0.4);
r.render(scene, cam);
window.__done = { h, min: box.min.y, max: box.max.y };
</script></body></html>
